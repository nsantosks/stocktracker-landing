<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impresión de Ticket</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Carga de html2canvas para rasterización de alta resolución -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #555; margin: 0; padding: 0; }
        #control-panel { position: fixed; top: 0; width: 100%; background: #1a2a40; padding: 10px; display: flex; justify-content: center; gap: 10px; z-index: 100; flex-wrap: wrap; box-sizing: border-box; }
        .btn { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; font-size: 12px; }
        .btn-bt { background: #0284c7; color: white; }
        .status-bar { width: 100%; text-align: center; color: #cbd5e1; font-size: 11px; margin-top: 4px; font-family: sans-serif; }
        
        /* El ancho por defecto es 72mm; la función lo redimensiona dinámicamente si recibe 'ancho' en la URL */
        .ticket-wrapper { width: 72mm; margin: 80px auto 20px auto; background: #fff; padding: 3mm 1mm; box-sizing: border-box; font-size: 10px; line-height: 1.2; }
        
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        .logo { max-width: 50mm; max-height: 25mm; margin: 0 auto 4px auto; display: block; filter: grayscale(100%); }
        .divider { border-top: 1px dashed #000; margin: 4px 0; }
        .header-emisor { font-size: 16px; font-weight: bold; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 3px; }
        td { padding: 2px 0; font-size: 9.5px; vertical-align: top; }
        .prod-title { font-size: 13px; padding-top: 3px; }
        .prod-detail { font-size: 13px; color: #000; padding-bottom: 3px; }
        .prod-subtotal { font-size: 13px; padding-top: 3px; }
        .border-bottom { border-bottom: 1px dotted #888; }
        .total-box { font-size: 15px; margin-top: 6px; text-align: right; }
        @media print { body { background: none; } #control-panel { display: none; } .ticket-wrapper { width: 72mm; margin: 0; padding: 0; } }
    </style>
</head>
<body>

    <div id="control-panel">
        <button id="btnBT" onclick="imprimirDirectoBT()" class="btn btn-bt">
            <span class="material-icons">bluetooth</span> Imprimir Impresora Portatil
        </button>
        <button onclick="window.print()" class="btn" style="background: white;">
            <span class="material-icons">print</span> Imprimir (PC)
        </button>
        <div id="status" class="status-bar">Cargando datos del ticket...</div>
    </div>

    <div class="ticket-wrapper" id="ticketContent" style="display:none;">
        <div class="text-center">
            <img id="imgLogo" class="logo" src="" crossorigin="anonymous">
            <div class="header-emisor" id="emisorNombre"></div>
        </div>

        <div style="margin-top: 4px;">
            <div  style="font-size: 12px;"><strong id="lblTituloDoc">COTIZACIÓN:</strong> <strong><span id="docId"></span></strong></div>
            <div  style="font-size: 12px;"><strong>Fecha de Emisión:</strong> <span id="docFecha"></span></div>
        </div>

        <div style="text-transform: uppercase; margin-top: 6px;">
            <div style="font-size: 12px;"><strong>NOMBRE O RAZÓN SOCIAL:</strong> <span id="cliNombre"></span></div>
            <div style="font-size: 10px;">
                <strong>CI/RIF:</strong> <span id="cliRif"></span>
                <span id="wrapSunagro"> | <strong>SUNAGRO:</strong> <span id="cliSunagro"></span></span>
            </div>
            <div id="wrapTlf" style="font-size: 10px;"><strong>Telf:</strong> <span id="cliTlf"></span></div>
            <div id="wrapDir" style="font-size: 10px;"><strong>Dir:</strong> <span id="cliDir"></span></div>
        </div>

        <div class="divider"></div>

        <table>
            <tbody id="tblItems"></tbody>
        </table>

        <div class="divider"></div>

        <div class="total-box bold">
            TOTAL ref.: <strong><span id="docTotal"></span></strong>
        </div>

        <div style="font-size: 10px; margin-top: 4px;">
            <strong>Peso Total:</strong> <span id="docPeso"></span> Kg
        </div>

        <div id="wrapNotas" style="font-size: 8.5px; margin-top: 4px;">
            <strong>Notas:</strong> <span id="docNotas"></span>
        </div>

        <div class="divider"></div>
        <div class="divider"></div>

        <div class="text-center bold" style="margin-top: 8px; font-size: 10px;">
            *** La firma y sello de este documento implica que el producto fue recibido en perfectas condiciones. ***
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/a/macros/gammalielanalytics.com/s/AKfycbyvV6UobJhplaHBON3PqqCLV1F9MNSY_kaGByzYAlPA5wPDDFfXT0wqaCV0S92TIbo/exec";
        
        const CANDIDATE_SERVICES = [
            'e7810a71-73ae-499d-8c15-faa9aef0c3f2', 
            '49535343-fe7d-4ae5-8fa9-9fafd205e455', 
            '0000ff00-0000-1000-8000-00805f9b34fb', 
            '0000ae30-0000-1000-8000-00805f9b34fb', 
            '000018f0-0000-1000-8000-00805f9b34fb'  
        ];

        let datosGlobales = null;
        let ANCHO_MM = 80; // Ancho predeterminado en milímetros
        let MODO_VELOCIDAD = 'normal'; // Valor por defecto: 'fast' | 'normal'

        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const idgs = params.get('idgs');
            const idcot = params.get('idcot');
            const hdid = params.get('hdid') || 'COTIZACIÓN';
            
            // Lectura parametrizada del ancho del papel enviado por AppSheet/URL
            ANCHO_MM = parseFloat(params.get('ancho')) || 80;

            // Lectura del parámetro idVel ('fast' por defecto si no se envía)
            const velParam = (params.get('idVel') || 'fast').toLowerCase().trim();
            MODO_VELOCIDAD = (velParam === 'normal') ? 'normal' : 'fast';

            if (!idgs || !idcot) {
                document.getElementById('status').innerText = "⚠️ Faltan parámetros en la URL (idgs, idcot)";
                return;
            }

            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?action=getDatos&idgs=${idgs}&idcot=${idcot}&hdid=${encodeURIComponent(hdid)}`);
                datosGlobales = await response.json();

                if (datosGlobales.error) {
                    document.getElementById('status').innerText = "❌ " + datosGlobales.error;
                    return;
                }

                renderizarTicket();
            } catch (err) {
                document.getElementById('status').innerText = "Error al conectar con el servidor: " + err.message;
            }
        });

        function renderizarTicket() {
            const ticketElement = document.getElementById('ticketContent');
            const anchoImprimibleMm = Math.round(ANCHO_MM * 0.9);
            ticketElement.style.width = `${anchoImprimibleMm}mm`;

            document.getElementById('imgLogo').src = datosGlobales.emisor.logo || '';
            document.getElementById('emisorNombre').innerText = datosGlobales.emisor.nombre || '';
            document.getElementById('lblTituloDoc').innerText = (datosGlobales.tituloDoc || 'COTIZACIÓN') + ':';
            document.getElementById('docId').innerText = datosGlobales.id;
            document.getElementById('docFecha').innerText = datosGlobales.fecha;
            document.getElementById('cliNombre').innerText = datosGlobales.cliente.nombre;
            document.getElementById('cliRif').innerText = datosGlobales.cliente.rif;

            // --- Visibilidad condicional para ahorrar papel ---
            const sunagro = String(datosGlobales.cliente.sunagro || '').trim();
            document.getElementById('cliSunagro').innerText = sunagro;
            document.getElementById('wrapSunagro').style.display = sunagro ? 'inline' : 'none';

            const tlf = String(datosGlobales.cliente.telefono || '').trim();
            document.getElementById('cliTlf').innerText = tlf;
            document.getElementById('wrapTlf').style.display = tlf ? 'block' : 'none';

            const dir = String(datosGlobales.cliente.direccion || '').trim();
            document.getElementById('cliDir').innerText = dir;
            document.getElementById('wrapDir').style.display = dir ? 'block' : 'none';

            const notas = String(datosGlobales.notas || '').trim();
            document.getElementById('docNotas').innerText = notas;
            document.getElementById('wrapNotas').style.display = notas ? 'block' : 'none';
            // --------------------------------------------------

            let itemsHtml = '';
            datosGlobales.items.forEach(item => {
                const subtotal = (item.cantidadOriginal * item.precio).toFixed(2);
                itemsHtml += `
                    <tr><td colspan="2" class="prod-title"><strong>${item.producto}</strong></td></tr>
                    <tr class="border-bottom">
                        <td class="prod-detail">${item.cantidadOriginal} ${item.unidad || 'UND'} x ${Number(item.precio).toFixed(2)}</td>
                        <td class="prod-subtotal" style="text-align:right">${subtotal}</td>
                    </tr>`; 
            });

            document.getElementById('tblItems').innerHTML = itemsHtml;
            document.getElementById('docTotal').innerText = datosGlobales.total.toFixed(2);
            document.getElementById('docPeso').innerText = (datosGlobales.pesoTotal || 0).toFixed(2);

            ticketElement.style.display = 'block';
            document.getElementById('status').innerText = `Listo para conectar por Bluetooth (${ANCHO_MM}mm | Modo: ${MODO_VELOCIDAD.toUpperCase()})`;
        }

        // --- ENCODER DE MAPA DE BIT RÁSTER ESC/POS (GS v 0) ---
        class EscPosRasterEncoder {
            constructor() { this.buffer = []; }

            init() {
                this.buffer.push(0x1B, 0x40); // Reset
                return this;
            }

            drawCanvas(canvas) {
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                const imgData = ctx.getImageData(0, 0, width, height).data;

                const widthBytes = Math.ceil(width / 8);

                // Comando ESC/POS GS v 0 (Impresión ráster)
                const xL = widthBytes & 0xFF;
                const xH = (widthBytes >> 8) & 0xFF;
                const yL = height & 0xFF;
                const yH = (height >> 8) & 0xFF;

                this.buffer.push(0x1D, 0x76, 0x30, 0x00, xL, xH, yL, yH);

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < widthBytes; x++) {
                        let byteVal = 0;
                        for (let bit = 0; bit < 8; bit++) {
                            const pixelX = x * 8 + bit;
                            if (pixelX < width) {
                                const idx = (y * width + pixelX) * 4;
                                const r = imgData[idx];
                                const g = imgData[idx + 1];
                                const b = imgData[idx + 2];
                                const alpha = imgData[idx + 3];

                                const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                                if (alpha > 128 && luminance < 180) {
                                    byteVal |= (128 >> bit);
                                }
                            }
                        }
                        this.buffer.push(byteVal);
                    }
                }
                return this;
            }

            feed(lines = 4) {
                this.buffer.push(0x1B, 0x64, lines);
                return this;
            }

            encode() {
                return new Uint8Array(this.buffer);
            }
        }

        async function imprimirDirectoBT() {
            const btn = document.getElementById('btnBT');
            const status = document.getElementById('status');
            const ticketElement = document.getElementById('ticketContent');

            if (!navigator.bluetooth) {
                alert("Web Bluetooth no está disponible en este navegador. Usa Google Chrome en Android.");
                return;
            }

            try {
                btn.disabled = true;
                status.innerText = `Procesando imagen (${ANCHO_MM}mm | Modo: ${MODO_VELOCIDAD.toUpperCase()})...`;

                // Conversión aritmética: Factor ~4.8 px/mm para cabezal de 203 DPI
                //const canvasWidthPx = Math.round(ANCHO_MM * 4.8);

                // 1. Ajustar la captura exactamente a los 576 puntos nativos del cabezal (72mm a 203 DPI)
                //const canvasWidthPx = Math.round(ANCHO_MM * 3.6);
                
                //1. Ajuste dinámico según el ancho real del contenedor del ticket (para evitar recortes)
                const canvasWidthPx = ticketElement.offsetWidth;

                // 1. Captura del HTML ajustada dinámicamente según el ancho parametrizado
                const canvas = await html2canvas(ticketElement, {
                    scale: 2,
                    width: canvasWidthPx,
                    useCORS: true,
                    logging: false,
                    backgroundColor: '#ffffff'
                });

                status.innerText = "Buscando impresora Bluetooth...";

                // 2. Conexión por Bluetooth BLE
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: CANDIDATE_SERVICES
                });

                status.innerText = `Conectando a ${device.name || 'Impresora Portatil'}...`;

                const server = await device.gatt.connect();
                let writeChar = null;
                const primaryServices = await server.getPrimaryServices();

                for (const service of primaryServices) {
                    try {
                        const characteristics = await service.getCharacteristics();
                        const targetChar = characteristics.find(c => 
                            c.properties.write || c.properties.writeWithoutResponse
                        );
                        if (targetChar) {
                            writeChar = targetChar;
                            break;
                        }
                    } catch (e) {}
                }

                if (!writeChar) {
                    throw new Error("No se encontró canal de escritura BLE en la impresora.");
                }

                status.innerText = "Traduciendo a matriz de puntos...";

                // 3. Generación de matriz gráfica de puntos (GS v 0)
                const rasterEncoder = new EscPosRasterEncoder();
                rasterEncoder.init()
                             .drawCanvas(canvas)
                             .feed(6); // Avance extra para superar la cuchilla de corte

                status.innerText = "Enviando datos a la impresora...";

                // 4. Envío sincronizado para evitar cortes a mitad del ticket
                const dataBytes = rasterEncoder.encode();
                const chunkSize = 20; // MTU seguro estándar BLE
                const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

                for (let i = 0; i < dataBytes.length; i += chunkSize) {
                    const chunk = dataBytes.slice(i, i + chunkSize);

                    if (MODO_VELOCIDAD === 'normal') {
                        if (writeChar.properties.write) {
                            await writeChar.writeValue(chunk);
                        } else {
                            await writeChar.writeValueWithoutResponse(chunk);
                            await esperar(25);
                        }
                    } else {
                        // En modo 'fast', pausamos 18ms cada 20 bytes para no saturar el buffer
                        if (writeChar.properties.writeWithoutResponse) {
                            await writeChar.writeValueWithoutResponse(chunk);
                            await esperar(18);
                        } else {
                            await writeChar.writeValue(chunk);
                        }
                    }
                }

                status.innerText = "Finalizando impresión física...";
                // Esperar 4.5 segundos a que el cabezal termine de imprimir antes de cortar Bluetooth
                await esperar(4500);

                status.innerText = "¡Impresión completada con éxito!";
                device.gatt.disconnect();

            } catch (err) {
                console.error(err);
                status.innerText = "Error: " + err.message;
                alert("Error durante la impresión: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
